services:
  # PostgreSQL
  postgres:
    image: postgres:16
    container_name: supportify_db
    restart: on-failure
    environment:
      POSTGRES_DB: supportify_main
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartledger_main"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    networks:
      - postgres-network

volumes:
  postgres-data:

networks:
  postgres-network:
